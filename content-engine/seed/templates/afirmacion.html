<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1350">
<meta name="formats" content="post">
<style>
{{tokens}}
* { box-sizing: border-box; margin: 0; }
body { width: 1080px; height: 1350px; background: var(--acento); color: var(--fondo); font-family: var(--fuente); padding: 110px; display: flex; flex-direction: column; justify-content: space-between; }
.kicker { font-size: 28px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; min-height: 34px; }
h1 { font-size: 104px; line-height: 1.04; font-weight: 800; letter-spacing: -0.03em; text-wrap: balance; }
p { font-size: 36px; line-height: 1.35; max-width: 760px; }
</style>
</head>
<body>
<div class="kicker">{{kicker}}</div>
<h1>{{title}}</h1>
<p>{{body}}</p>
</body>
</html>
