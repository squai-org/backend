<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1350">
<meta name="formats" content="carrusel,post">
<style>
{{tokens}}
* { box-sizing: border-box; margin: 0; }
body { width: 1080px; height: 1350px; background: var(--fondo); color: var(--texto); font-family: var(--fuente); padding: 96px; display: flex; flex-direction: column; }
.kicker { font-size: 28px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acento); min-height: 34px; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 44px; }
h1 { font-size: 76px; line-height: 1.08; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
p { font-size: 38px; line-height: 1.38; color: var(--texto-secundario); text-wrap: pretty; }
p:empty { display: none; }
.first h1, .single h1 { font-size: 96px; }
footer { display: flex; justify-content: space-between; align-items: center; font-size: 26px; color: var(--texto-secundario); }
.bar { height: 6px; width: 120px; border-radius: 3px; background: var(--acento); }
.single .count { visibility: hidden; }
</style>
</head>
<body class="{{position}}">
<div class="kicker">{{kicker}}</div>
<main><h1>{{title}}</h1><p>{{body}}</p></main>
<footer><div class="bar"></div><div class="count">{{index}} / {{total}}</div></footer>
</body>
</html>
