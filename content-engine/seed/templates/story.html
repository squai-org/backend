<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="size" content="1080x1920">
<meta name="formats" content="story">
<style>
{{tokens}}
* { box-sizing: border-box; margin: 0; }
body { width: 1080px; height: 1920px; background: var(--fondo); color: var(--texto); font-family: var(--fuente); padding: 300px 96px 340px; display: flex; flex-direction: column; justify-content: center; gap: 48px; }
.kicker { font-size: 30px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acento); }
h1 { font-size: 92px; line-height: 1.06; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
p { font-size: 42px; line-height: 1.36; color: var(--texto-secundario); }
p:empty { display: none; }
</style>
</head>
<body>
<div class="kicker">{{kicker}}</div>
<h1>{{title}}</h1>
<p>{{body}}</p>
</body>
</html>
